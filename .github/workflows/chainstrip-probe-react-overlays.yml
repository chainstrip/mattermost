name: probe react-overlays (one-off)

# A ONE-OFF measurement, not a gate. Nothing depends on it and nothing blocks
# on it, so it is workflow_dispatch only.
#
# WHY. On cli 0.3.8 the same commit validates react-overlays on macOS and rules
# it overlay-failed on this Linux runner. That is NOT the tool disagreeing with
# itself on the same evidence — the Linux run CONFIRMED the failure by the
# isolation standard (delete_post_modal.test.tsx failed alone with the overlay
# and passed alone at stock, twice each), while three hand-run isolation
# attempts on macOS could not reproduce it at all.
#
# So the open question is exactly one thing: on Linux, does that failure
# REPRODUCE? A genuine platform-specific extraction regression fails every time.
# An intermittent that isolation happened to catch once does not. One
# observation cannot tell those apart, which is why this exists rather than a
# verdict being written up from a single run.
#
# CORRECTED after the first attempt: that version ran the SINGLE implicated test
# file and got 0/5, which settled nothing. The baseline's overlay arm failed on
# 48 files, all modal components — react-overlays' own surface — so the failure
# is broad, and a single-file run cannot exhibit it. Worse, the jsdom leak this
# is entangled with is CROSS-FILE, and a lone file is precisely the context
# where a cross-file leak cannot occur. This runs the FULL mapped set, which is
# what the sweep actually validated.

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "how many times to repeat the differential"
        default: "5"

jobs:
  probe:
    runs-on: ${{ vars.CHAINSTRIP_LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      CHAINSTRIP_RUN_ORIGIN: ci
      NODE_OPTIONS: --max_old_space_size=5120
      DEP: react-overlays
      FILE: src/components/delete_post_modal/delete_post_modal.test.tsx
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/webapp-setup
      - uses: ./.github/actions/setup-chainstrip
        with:
          version: ${{ vars.CHAINSTRIP_CLI_VERSION || 'latest' }}
      - name: inventory + classify
        run: |
          $CHAINSTRIP inventory
          $CHAINSTRIP classify
      - name: trace (the mapped set is what the sweep validated against)
        run: $CHAINSTRIP trace
      - name: extract the dep under test
        run: $CHAINSTRIP extract "$DEP"
      - name: measure the single-file failure RATE
        run: |
          set -uo pipefail
          n="${{ inputs.repeats }}"
          val=0; base=0; ovl=0; other=0
          for i in $(seq 1 "$n"); do
            # Parse the VERDICT. The previous probe tested the exit code, and
            # `validate` exits 0 for baseline-failed too, so "clean 3/3" was
            # counted from runs whose overlay arm never executed.
            v=$($CHAINSTRIP validate "$DEP" --tests "$FILE" 2>&1 | grep -oE "verdict: [a-z-]+" | tail -1)
            echo "attempt $i/$n -> ${v:-<none>}"
            case "$v" in
              *validated)       val=$((val+1));;
              *baseline-failed) base=$((base+1));;
              *overlay-failed)  ovl=$((ovl+1));;
              *)                other=$((other+1));;
            esac
          done
          echo "===== $FILE alone, overlay applied, on $(uname -s) $(nproc) cores"
          echo "===== validated=$val  overlay-failed=$ovl  baseline-failed=$base  other=$other  (n=$n)"
      - name: upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-overlays-probe
          path: .chainstrip/*-report.json
          include-hidden-files: true
          if-no-files-found: ignore
