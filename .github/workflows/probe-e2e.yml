name: probe e2e playwright

# A ~10-minute probe, not a measurement. The baseline reaches cove2e about 2h45m
# in, and its console shows only the TAIL of a failing suite - which for a node
# crash is the stack, not the "Cannot find module 'X'" line that names the
# cause. This runs the same install and the same suite invocation and prints the
# whole thing.
#
# Dispatch only. Delete it once the e2e path is green.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ${{ vars.CHAINSTRIP_LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/webapp-setup
      - name: probe/browser-without-root
        working-directory: e2e-tests/playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_BROWSERS_PATH: "0"
          PW_DEPS_DIR: ${{ github.workspace }}/.pw-deps
        run: |
          set -x
          npm ci
          npx playwright install --with-deps chromium || npx playwright install chromium
          BIN=$(ls -d node_modules/playwright-core/.local-browsers/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell 2>/dev/null | head -1)
          echo "browser: $BIN"
          echo "--- missing libraries BEFORE:"; ldd "$BIN" 2>/dev/null | grep "not found" || echo "  none"
          pkgs="$(npx playwright install-deps --dry-run chromium 2>/dev/null | tr ' ' '\n' | grep -E '^lib[a-z0-9.+-]+$' | sort -u | tr '\n' ' ')"
          [ -n "$pkgs" ] || pkgs="libnspr4 libnss3 libnssutil3 libsmime3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libgbm1 libxkbcommon0 libpango-1.0-0 libcairo2 libasound2t64"
          echo "--- packages playwright names: $pkgs"
          mkdir -p "$PW_DEPS_DIR" && (cd "$PW_DEPS_DIR" && (apt-get download $pkgs || true) && for d in *.deb; do [ -f "$d" ] && dpkg -x "$d" .; done)
          export LD_LIBRARY_PATH="$PW_DEPS_DIR/usr/lib/x86_64-linux-gnu:$PW_DEPS_DIR/lib/x86_64-linux-gnu"
          echo "--- missing libraries AFTER:"; ldd "$BIN" 2>/dev/null | grep "not found" || echo "  none"
          echo "--- can playwright actually launch it?"
          node -e "const{chromium}=require('playwright-core');chromium.launch().then(async b=>{const p=await b.newPage();await p.setContent('<h1>ok</h1>');console.log('LAUNCH OK, title len',(await p.content()).length);await b.close();process.exit(0);}).catch(e=>{console.log('LAUNCH FAILED:',String(e).slice(0,300));process.exit(1);})"
