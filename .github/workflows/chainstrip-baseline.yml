name: chainstrip baseline (warm)

# The heavy half of the split. Runs on trunk only, builds the full hardened
# artifact (chainstrip run: inventory -> ... -> pack), and CACHES the ~270 MB
# gate-baseline set keyed on webapp/package-lock.json. PRs restore this instead
# of rebuilding. This is the expensive job — put it on a LARGER runner (set the
# repo/org variable CHAINSTRIP_LARGE_RUNNER, e.g. "ubuntu-latest-8-cores"); it
# falls back to a stock runner, which may be too small for the webapp
# build+suite.

on:
  # DISPATCH ONLY. A baseline is a MEASUREMENT that occupies a runner for an
  # hour or more, and nothing about a push tells you a measurement is wanted
  # now. The `paths-ignore` lists this replaces were a partial fix for the same
  # problem — they grew after a probe push started a full baseline 6 seconds
  # before the probe was dispatched, leaving the measurement queued behind it —
  # but they could not cover the case that kept recurring: editing THIS file.
  # Every workflow fix (the artifact upload, the corepack ordering, the node
  # bootstrap) started an unwanted baseline, twice landing two runs of the same
  # target at once.
  #
  # The old argument for keeping the push trigger was that a change to this file
  # DOES change the run. True, and it does not follow that the run should start
  # by itself: the person editing it is the person who knows whether a fresh
  # measurement is worth an hour of the box.
  workflow_dispatch: {}

concurrency:
  group: chainstrip-baseline
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ${{ vars.CHAINSTRIP_LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 330
    permissions:
      contents: read
      packages: read # read @chainstrip/cli from GitHub Packages with the ambient token
    env:
      CHAINSTRIP_RUN_ORIGIN: ci
      NODE_OPTIONS: --max_old_space_size=5120 # what the webapp's own CI gives jest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/webapp-setup # node from .nvmrc + npm install + platform packages
      - uses: ./.github/actions/setup-chainstrip
        with:
          version: ${{ vars.CHAINSTRIP_CLI_VERSION || 'latest' }}
          # chainstrip.config.json says `"sandbox": {"mode": "enforce"}`, and
          # enforce without a launcher REFUSES the run rather than quietly
          # degrading — so this is not optional decoration, it is what makes the
          # config runnable. The variable lets the launcher be pinned or dropped
          # without editing the workflow; blank means no containment.
          csbox: ${{ vars.CHAINSTRIP_CSBOX_PACKAGE || '@chainstrip/csbox-linux-x64@0.1.0' }}
          # Set CHAINSTRIP_CSBOX_PATH while the package is unreadable to this
          # repo's token; clearing it goes back to the npm install.
          csbox_path: ${{ vars.CHAINSTRIP_CSBOX_PATH }}
      # cove2e runs the target's OWN e2e suite, and `e2e-tests/playwright` is a
      # SEPARATE npm project that `webapp-setup` does not touch. Without this the
      # suite dies before its first spec with a command-not-found, which is the
      # incident CLAUDE.md records for 2026-08-25 ("rollup: command not found",
      # exit 127) — and an e2e suite that never RAN captures nothing, so covtrim
      # loses every function only a browser executes.
      #
      # Browsers are installed explicitly instead of through the project's
      # postinstall, which fetches chromium AND firefox. `test:smoke` runs
      # `--project=chrome`, so firefox is download time nothing uses.
      - name: ci/e2e-playwright-setup
        working-directory: e2e-tests/playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          # INSTALL THE BROWSER WHERE THE CHILD WILL LOOK. Playwright resolves
          # its browsers under $HOME/.cache/ms-playwright, and cove2e's suite
          # child runs with the SANDBOX home - so a browser installed into the
          # runner's real home is invisible to it. MEASURED 2026-09-05: the
          # suite ran, reached its setup specs, and every one failed with
          # "Executable doesn't exist at
          # .chainstrip/sandbox/home/.cache/ms-playwright/chromium_headless_shell-1228/...".
          #
          # `0` is playwright's own answer: keep the browser inside
          # node_modules, which is a directory the child already has. It must be
          # set for BOTH halves - here, and in the config's e2e.env - or the two
          # look in different places, which is the bug restated.
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: |
          npm ci
          # `--with-deps` needs sudo, which a self-hosted runner may not grant.
          # Falling back keeps the run alive: the browser still installs, and a
          # missing system library then surfaces at cove2e instead of here.
          npx playwright install --with-deps chromium || npx playwright install chromium
      - name: build baseline
        run: $CHAINSTRIP run
      - name: cache the gate baseline
        uses: actions/cache/save@v4
        with:
          key: chainstrip-baseline-${{ hashFiles('webapp/package-lock.json') }}
          # exactly the set the gate reads — NOT .chainstrip/workspaces|bundles|runs
          path: |
            .chainstrip/artifacts
            .chainstrip/extracted-deps
            .chainstrip/inventory.json
            .chainstrip/tiers.json
            .chainstrip/test-impact-map.json
            .chainstrip/covtrim-report.json
            .chainstrip/fileprune-report.json
      - name: upload human-readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-report
          # THE LOGS COME TOO. Every stage message that names a log file says so
          # because the console shows a 25-line slice and the file has the rest -
          # and for a node crash the informative line is the FIRST one, which a
          # tail never contains. Measured 2026-09-05: cove2e's suite died with
          # MODULE_NOT_FOUND, the console showed the stack and the requireStack
          # array, and the line naming the missing module was in a file this
          # artifact did not carry. Diagnosing it took a separate probe run.
          path: |
            .chainstrip/*-report.json
            .chainstrip/*.log
          # .chainstrip is a DOT-directory, and the action skips hidden paths by
          # default: without this every "baseline-report" artifact uploaded zero
          # files and the step still reported success (if-no-files-found: ignore).
          include-hidden-files: true
          if-no-files-found: ignore
